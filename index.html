<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园知识库 · 学生手册</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#18382d;font:16px/1.8 'Microsoft YaHei',sans-serif}main{max-width:1080px;margin:48px auto;padding:0 24px}header{border-bottom:1px solid #ccd8cf;padding-bottom:24px}.label{font-size:13px;letter-spacing:2px;color:#48745f}h1{font-size:38px;margin:8px 0}p{color:#52675b}.status{font-size:13px}section{background:white;border:1px solid #dce4dc;border-radius:16px;padding:28px;margin:24px 0}textarea{width:100%;min-height:104px;padding:16px;font:inherit;border:1px solid #b9cbbd;border-radius:10px;resize:vertical}button{cursor:pointer;border:0;background:#235b43;color:white;padding:12px 24px;border-radius:8px;font:inherit;margin:10px 8px 0 0}button.secondary{background:#eaf1eb;color:#235b43}button:disabled{opacity:.5;cursor:wait}.examples button{font-size:13px;padding:7px 12px;background:#edf3ee;color:#355b45}#answer{white-space:pre-wrap;color:#203f30}details{border-top:1px solid #dce4dc;padding:16px 0}summary{cursor:pointer;font-weight:bold}.original{white-space:pre-wrap;color:#374a40;font-size:14px;max-height:420px;overflow:auto}.meta{font-size:12px;color:#6b7b6f}.error{color:#ab342e}footer{font-size:12px;color:#718176;margin-bottom:36px}</style>
<style>@media(max-width:600px){main{margin:24px auto;padding:0 18px}h1{font-size:28px;line-height:1.6}header{padding-bottom:18px}section{padding:18px;margin:18px 0}.label{font-size:11px;letter-spacing:1px}button{padding:10px 16px}h2{font-size:22px}p{margin:10px 0}}</style>
<main><header><div class="label">LOCAL KNOWLEDGE / 郑州轻工业大学</div><h1>你的学生手册，随问随查。</h1><p>查询学校规定，查看原文依据。文档、检索与回答均在本机处理。</p><div class="status" id="status">正在连接本地知识库…</div></header>
<section><label for="q">你想了解什么？</label><textarea id="q" placeholder="例如：国家奖学金的申请条件是什么？" maxlength="1500"></textarea><div class="examples"><button>国家奖学金的申请条件是什么？</button><button>学生对处分有异议，如何申诉？</button><button>转专业有哪些条件？</button><button>学生公寓有哪些管理规定？</button></div><button id="ask">查询并回答</button><button id="search" class="secondary">只查看原文</button><div id="progress" role="status"></div></section>
<section id="result" hidden><h2 id="resulttitle">回答</h2><div id="answer"></div><h3>引用原文</h3><div id="sources"></div></section>
<footer>资料来源：你提供的《学生手册》Word 文件。引用按章节、条款和正文块定位，正文块不是页码。内容仅反映此文件版本，执行具体事项前请核对学校最新通知。回答可能有误，请结合引用原文核实。</footer></main>
<script>const $=id=>document.getElementById(id);fetch('/api/status').then(r=>r.json()).then(s=>$('status').textContent=`已就绪 · ${s.chunks} 个原文片段 · 本地模型 ${s.model}`).catch(()=>$('status').textContent='服务未连接，请重新启动知识库');document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{$('q').value=b.textContent});async function run(mode){const q=$('q').value.trim();if(!q)return;$('ask').disabled=$('search').disabled=true;$('progress').textContent=mode==='ask'?'正在检索手册并生成回答，首次加载模型可能需要一些时间…':'正在检索原文…';$('result').hidden=true;try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();if(!r.ok)throw Error(d.error);$('result').hidden=false;$('resulttitle').textContent=mode==='ask'?'回答':'检索结果';$('answer').textContent=d.answer||'以下为与你的问题相关的原文。';$('sources').replaceChildren();d.sources.forEach((c,i)=>{const el=document.createElement('details');el.open=i===0;const s=document.createElement('summary');s.textContent=`[${i+1}] ${c.section} · ${c.article||'相关内容'}`;const m=document.createElement('div');m.className='meta';m.textContent=c.source+' / '+c.location;const p=document.createElement('div');p.className='original';p.textContent=c.text;el.append(s,m,p);$('sources').append(el)});$('progress').textContent='已完成'}catch(e){$('progress').textContent='处理失败：'+e.message}finally{$('ask').disabled=$('search').disabled=false}}$('ask').onclick=()=>run('ask');$('search').onclick=()=>run('search');</script></html>
